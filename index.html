<html lang="en">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..650;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Atlas design system (from the Roamd Atlas pilot). Old variable names kept: --bg is paper, --muted is quiet text, --line is a rule, --accent is ink (the interface accent). */
:root{--bg:#f5f1e7;--card:#fbf9f3;--ink:#1f2a33;--ink-2:#56616a;--muted:#646b67;--line:rgba(31,42,51,.12);--border:rgba(31,42,51,.30);--grat:rgba(31,42,51,.08);--land:#fbf8f0;--sea:#dfe5e1;
--been:#3b887c;--want:#c99a2e;--lived:#5e9fd4;--drive:#94a783;--been-ink:#fff;--want-ink:#1f2a33;--lived-ink:#1f2a33;--drive-ink:#1f2a33;--accent:#1f2a33;--accent-ink:#f5f1e7;--soft:rgba(31,42,51,.06);--danger:#9e4f30;--clay:#9e4f30;
--both:#3b887c;--mine:#1f2a33;--them:#9e4f30;--shadow:0 1px 2px rgba(31,42,51,.07),0 8px 24px rgba(31,42,51,.10);color-scheme:light;
--t-xs:11px;--t-sm:12.5px;--t-md:14px;--t-base:15px;--t-lg:18px;--t-xl:24px;--t-2xl:32px;--t-3xl:56px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--gutter:18px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;
--font-display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;--font-sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181d;--card:#1a2128;--ink:#ece6da;--ink-2:#a9b0b3;--muted:#858f95;--line:rgba(236,230,218,.12);--border:rgba(236,230,218,.26);--grat:rgba(236,230,218,.06);--land:#252e37;--sea:#0e1317;--been:#5fb2a4;--want:#e2b75a;--lived:#86bde8;--drive:#98aa8a;--been-ink:#13181d;--want-ink:#13181d;--lived-ink:#13181d;--drive-ink:#13181d;--accent:#ece6da;--accent-ink:#13181d;--soft:rgba(236,230,218,.07);--danger:#e08b67;--clay:#e08b67;--both:#5fb2a4;--mine:#ece6da;--them:#e08b67;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13181d;--card:#1a2128;--ink:#ece6da;--ink-2:#a9b0b3;--muted:#858f95;--line:rgba(236,230,218,.12);--border:rgba(236,230,218,.26);--grat:rgba(236,230,218,.06);--land:#252e37;--sea:#0e1317;--been:#5fb2a4;--want:#e2b75a;--lived:#86bde8;--drive:#98aa8a;--been-ink:#13181d;--want-ink:#13181d;--lived-ink:#13181d;--drive-ink:#13181d;--accent:#ece6da;--accent-ink:#13181d;--soft:rgba(236,230,218,.07);--danger:#e08b67;--clay:#e08b67;--both:#5fb2a4;--mine:#ece6da;--them:#e08b67;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
:root{--been-t:color-mix(in srgb,var(--been) 30%,var(--land));--want-t:color-mix(in srgb,var(--want) 24%,var(--land));--drive-t:color-mix(in srgb,var(--drive) 32%,var(--land))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--t-base);line-height:1.5;font-stretch:96%;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--bg)}
.brand{font-family:var(--font-display);font-weight:500;font-size:var(--t-xl);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:1}
.brand img{width:28px;height:28px;border-radius:var(--r-sm)}
.iconbtn{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}.iconbtn.sm{width:32px;height:32px}.iconbtn.sm .ic{width:17px;height:17px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.view[hidden]{display:none!important}
#v-map{display:flex;flex-direction:column;padding-bottom:10px;overflow:hidden}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--t-xs);font-weight:600;color:var(--muted);padding:4px 0;border-radius:var(--r-md)}
.tabs button.on{color:var(--accent)}.tabs .ic{width:23px;height:23px}
.mapwrap{flex:1;min-height:220px;position:relative;border-radius:var(--r-lg);background:var(--sea);overflow:hidden;border:1px solid var(--line)}
#mapBox{position:absolute;inset:0}
.map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.map.small{height:auto;touch-action:auto;border-radius:var(--r-lg);background:var(--sea)}
.sphere{fill:var(--sea)}
.c{fill:var(--land);stroke:var(--bg);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.c.none{cursor:default}.c.s-been{fill:var(--been)}.c.s-want{fill:var(--want)}.c.s-lived{fill:var(--lived)}
.dotg{cursor:pointer}.dotg .hit{fill:transparent}.dotg .dm{fill:var(--land);stroke:var(--card);stroke-width:1.2;vector-effect:non-scaling-stroke}
.dotg.s-been .dm{fill:var(--been)}.dotg.s-want .dm{fill:var(--want)}.dotg.s-lived .dm{fill:var(--lived)}
.cdot{stroke:var(--card);stroke-width:1.5}.cdot.s-both{fill:var(--both)}.cdot.s-mine{fill:var(--mine)}.cdot.s-them{fill:var(--them)}
.c.s-both{fill:var(--both)}.c.s-mine{fill:var(--mine)}.c.s-them{fill:var(--them)}
@media (hover:hover){.c:not(.none):hover{filter:brightness(.88)}}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);font-size:var(--t-lg);font-weight:600}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.regionbar{margin:10px 0 0}
select,input:not([type=checkbox]):not([type=file]),textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=date]{min-height:44px}
textarea{resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 0;font-size:var(--t-md);color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}.lg b{color:var(--ink)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.been{background:var(--been)}.dot.want{background:var(--want)}.dot.lived{background:var(--lived)}.dot.both{background:var(--both)}.dot.mine{background:var(--mine)}.dot.them{background:var(--them)}
.nag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--soft);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:10px;font-size:var(--t-md)}.nag span{flex:1 1 180px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:var(--t-md);border-radius:var(--r-md)}.btn.sm .ic{width:17px;height:17px}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.4}.btn:active{transform:scale(.98)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.listtools{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{padding:6px 12px;border-radius:var(--r-pill);background:var(--soft);font-size:var(--t-md);font-weight:600;white-space:nowrap;color:var(--muted)}
.chips button.on{background:var(--ink);color:var(--bg)}
.rhead{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--font-display);font-size:var(--t-lg);margin:18px 2px 8px}
.rhead small{font:600 var(--t-sm) var(--font-sans);color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.card.pad{padding:14px 16px;margin-bottom:12px}
.crow{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.cmain{flex:1;display:flex;align-items:center;gap:10px;min-width:0;text-align:left;min-height:40px}
.cname{overflow:hidden;text-overflow:ellipsis}.cname small,.pick small{display:block;font-size:var(--t-sm);color:var(--muted)}
.flag{font-size:var(--t-xl);line-height:1}.flag.big{font-size:var(--t-2xl)}
.qb{display:flex;gap:4px;flex:none}
.q{font-size:var(--t-sm);font-weight:700;padding:7px 8px;border-radius:var(--r-sm);background:var(--soft);color:var(--muted);min-width:44px}
.q.on.q-been{background:var(--been);color:#fff}.q.on.q-want{background:var(--want);color:#241a05}.q.on.q-lived{background:var(--lived);color:#fff}
.empty{color:var(--muted);text-align:center;padding:24px 8px}.empty.big .ic{width:40px;height:40px;color:var(--accent)}
.phead{display:flex;align-items:center;gap:10px;padding-top:4px}.phead .chips{flex:1;margin:0}
details.reg{margin-top:14px}
details.reg summary{list-style:none;display:flex;align-items:center;gap:10px;padding:6px 2px;cursor:pointer}
details.reg summary::-webkit-details-marker{display:none}
.rtag{font:600 var(--t-xs)/1 var(--font-mono);letter-spacing:.06em;background:var(--ink);color:var(--bg);padding:5px 7px;border-radius:var(--r-sm);min-width:36px;text-align:center}
.rname{font-family:var(--font-display);font-size:var(--t-lg);font-weight:600;flex:1}
summary small{color:var(--muted);font-size:var(--t-sm);font-weight:600}
summary .chev{transition:transform .2s;color:var(--muted)}details[open]>summary .chev{transform:rotate(90deg)}
.pcountry{margin:8px 0}
.pch{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}.pch b{flex:1}.pch small{color:var(--muted);font-weight:700}.pch .chev{color:var(--muted)}
.psec{border-top:1px solid var(--line);padding:4px 0 6px}
.psech{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:700;color:var(--muted);padding:8px 14px 2px;text-transform:uppercase;letter-spacing:.04em}.psech .ic{width:15px;height:15px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 14px}.prow:hover{background:var(--soft)}
.ptxt{flex:1;min-width:0;display:flex;flex-direction:column}.pt{font-weight:600}.pm{font-size:var(--t-sm);color:var(--muted)}
.badge{font-size:var(--t-xs);font-weight:700;padding:4px 8px;border-radius:var(--r-pill);flex:none}
.b-idea{background:var(--soft);color:var(--muted)}.b-booked{background:color-mix(in srgb,var(--want) 25%,transparent);color:var(--ink)}.b-done{background:color-mix(in srgb,var(--been) 25%,transparent);color:var(--ink)}
.wish{margin:8px 2px;font-size:var(--t-sm);color:var(--muted)}.wish>span{display:block;font-weight:700;margin-bottom:6px}
.wish div,.chips2{display:flex;flex-wrap:wrap;gap:6px}
.wchip{background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 10px;font-size:var(--t-md);color:var(--ink)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;box-shadow:var(--shadow)}
.hero .big{font-family:var(--font-display);font-size:var(--t-3xl);font-weight:700;line-height:1;color:var(--been)}.hero .big small{font-size:var(--t-xl);color:var(--muted)}
.hero b{font-size:var(--t-lg);display:block}.hero span{color:var(--muted);font-size:var(--t-md)}.hero .bar{grid-column:1/-1;margin-top:10px}
.bar{height:8px;border-radius:var(--r-pill);background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--been);border-radius:var(--r-pill)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px}.tile b{font-size:var(--t-xl);display:block}.tile span{font-size:var(--t-sm);color:var(--muted)}
.rbar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}.rbar .bar{grid-column:1/-1;height:6px}.rn{font-weight:600;font-size:var(--t-md)}.rv{font-size:var(--t-sm);color:var(--muted)}
.h3{margin:0 0 4px;font-family:var(--font-display);font-size:var(--t-lg)}
.frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}.frow:last-child{border:0}.frow .chev{color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--them);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 4px;text-align:center}.vs b{font-family:var(--font-display);font-size:var(--t-2xl);display:block;line-height:1}.vs span{font-size:var(--t-sm);color:var(--muted)}.vsmid{color:var(--muted);font-size:var(--t-sm)}
.vs>div:first-child b{color:var(--mine)}.vs>div:last-child b{color:var(--them)}
.cmpmap{position:relative;min-height:120px}

/* v2: tints, states, cities, planes, palettes */
.c.t-been{fill:color-mix(in srgb,var(--been) 34%,var(--land))}.c.t-want{fill:color-mix(in srgb,var(--want) 38%,var(--land))}.c.t-lived{fill:color-mix(in srgb,var(--lived) 34%,var(--land))}
.dotg.t-been .dm{fill:color-mix(in srgb,var(--been) 45%,var(--land))}.dotg.t-want .dm{fill:color-mix(in srgb,var(--want) 45%,var(--land))}.dotg.t-lived .dm{fill:color-mix(in srgb,var(--lived) 45%,var(--land))}
.rg{fill:transparent;stroke:color-mix(in srgb,var(--card) 70%,transparent);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.rg.s-been{fill:var(--been)}.rg.s-want{fill:var(--want)}.rg.s-lived{fill:var(--lived)}
.city{stroke:var(--card);stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:pointer}.city.s-been{fill:var(--been)}.city.s-want{fill:var(--want)}.city.s-lived{fill:var(--lived)}
.plane{fill:var(--ink);stroke:var(--card);stroke-width:1.1;vector-effect:non-scaling-stroke;paint-order:stroke;cursor:pointer}
.ic.lgp{width:15px;height:15px;fill:var(--ink);stroke:none}
#zplane .ic{fill:currentColor;stroke:none;width:19px;height:19px}
#zstate .ic{width:20px;height:20px}#zstate.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}#zstate:not(.on) .ic{opacity:.55}#zstate[hidden]{display:none}
.cmini{position:relative;min-height:140px;background:var(--sea);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mini{display:block;width:100%;max-height:52vh}
.mini .rg{fill:var(--land);stroke:var(--card);stroke-width:1}
.mini .rg.s-been{fill:var(--been)}.mini .rg.s-want{fill:var(--want)}.mini .rg.s-lived{fill:var(--lived)}
.mini .rg.sel{stroke:var(--ink);stroke-width:2.5}
.rsel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;min-height:48px;padding:8px 2px}
.rlist{margin:2px 0 6px}.rlist summary{cursor:pointer;font-weight:700;font-size:var(--t-md);color:var(--accent);padding:6px 2px}
.rlist .card{margin-top:6px}
.pickq0{margin:8px 0}
.q.on.q-been{background:var(--been);color:var(--been-ink)}.q.on.q-want{background:var(--want);color:var(--want-ink)}.q.on.q-lived{background:var(--lived);color:var(--lived-ink)}
.aprow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}.aprow:last-child{border:0}
.aprow .code{font:500 var(--t-base) var(--font-mono);min-width:42px}
.aprow .ptxt .pm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{display:flex;align-items:center;gap:2px}.cnt b{min-width:30px;text-align:center}
.togrow{display:flex;align-items:center;gap:10px;margin:16px 2px;font-weight:600}.togrow input{width:22px;height:22px;accent-color:var(--accent)}
.pal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border-radius:var(--r-md);padding:10px 12px;text-align:left;border:2px solid var(--line)}
.pal.on{border-color:var(--ink)}.pal .sw{display:flex;gap:4px}.pal .sw i{width:18px;height:18px;border-radius:50%;display:block}
.pal .pn{font-weight:700;font-size:var(--t-md)}.pal .pd{font-size:var(--t-sm);color:var(--muted);line-height:1.3}
.slot-pick{display:grid;gap:6px;margin:10px 0 12px}
.slot-btn{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-md);padding:8px 12px;text-align:left;border:2px solid var(--line);min-height:48px}
.slot-btn.on{border-color:var(--ink)}.slot-btn i{width:26px;height:26px;border-radius:50%;flex:none;display:block}
.slot-btn>span{display:flex;flex-direction:column;line-height:1.25}.slot-btn .d{font-size:var(--t-sm);color:var(--muted)}
.wheel{position:relative;margin:4px auto 0;touch-action:none;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.wheel canvas,.wheel svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.wl{stroke:#fff;stroke-width:2;opacity:.9}.wl.sug{stroke-dasharray:4 4;opacity:.75}.wc{fill:#fff}
.wd-main{stroke:#fff;stroke-width:3}.wd-sug{stroke:#fff;stroke-width:2}
.wrapchips{flex-wrap:wrap}
.sugrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.sug-sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.btn.wide{width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.cw-prev{display:flex;gap:6px;margin:6px 0}.cw-prev span{flex:1;text-align:center;padding:10px 4px;border-radius:var(--r-md);font-weight:700;font-size:var(--t-md)}

/* v4 */
:root{--home:#2f5f8a}
.c.home,.dotg.home .dm{fill:var(--home)}
.farc{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none}

/* ===== Atlas design pass (Nov 2026): shared components restyled to match the Roamd Atlas pilot ===== */
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.btn{min-height:40px;height:auto;padding:0 var(--s4);border-radius:var(--r-md);font-size:var(--t-md);font-weight:600;background:var(--ink);color:var(--bg);border:1px solid var(--ink)}

.btn.ghost:hover{background:var(--soft)}

.fld>span{font-size:var(--t-sm);font-weight:500;color:var(--ink-2)}

.rhead{font-size:var(--t-lg);margin:var(--s5) 2px var(--s2)}

.tt b{font-size:var(--t-xl)}.tt small{font-size:var(--t-sm);color:var(--ink-2)}
/* fewer boxes: cards are flat, rows carry the structure */
.card{box-shadow:none;border:1px solid var(--line);border-radius:var(--r-lg)}

.dot.lived{background:var(--lived);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 60%,transparent),inset 0 0 0 3px var(--land)}
.dot.drive{background:radial-gradient(circle,var(--drive) 0 .9px,transparent 1.2px) 0 0/4px 4px,var(--drive-t);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--drive) 60%,transparent)}
.dot.both{background:var(--both);box-shadow:none}
.dot.mine{background:repeating-linear-gradient(0deg,var(--mine) 0 1.2px,var(--land) 1.2px 4px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mine) 50%,transparent)}
.dot.them{background:repeating-linear-gradient(45deg,var(--them) 0 1.4px,var(--land) 1.4px 4.2px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--them) 55%,transparent)}
/* status buttons on a place: 48px, label first, check when on */
.stoggles{gap:var(--s2)}
.st{position:relative;justify-content:flex-start;gap:10px;min-height:48px;padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);font-weight:600;font-size:var(--t-md)}
.st .dot{width:18px;height:18px}
.st:not(.on) .dot{opacity:1}
.st-been{--c:var(--been)}.st-want{--c:var(--want)}.st-lived{--c:var(--lived)}.st-drive{--c:var(--drive)}
.st.on.st-been,.st.on.st-want,.st.on.st-lived,.st.on.st-drive{border-color:transparent;box-shadow:inset 0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.st.on::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:11px;border:solid var(--ink);border-width:0 2px 2px 0;transform:translateY(-65%) rotate(45deg)}
/* small status selectors in rows (countries, states, cities) */
.q{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:var(--t-xs);border-radius:var(--r-sm);min-height:32px}
.q-been{--c:var(--been)}.q-want{--c:var(--want)}.q-lived{--c:var(--lived)}.q-drive{--c:var(--drive)}
.q.on.q-been,.q.on.q-want,.q.on.q-lived,.q.on.q-drive{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
/* map frame and key */
.mapwrap{border-radius:var(--r-lg);border:1px solid var(--line)}
.mapctl button{background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);color:var(--ink);font-weight:500}
#zstate.on{color:var(--ink);border-color:var(--line);background:color-mix(in srgb,var(--ink) 10%,var(--card))}
.legend{gap:6px 14px;font-size:var(--t-sm);color:var(--ink-2)}
.lg b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
.toast,#toast{background:var(--ink);color:var(--bg);border-radius:var(--r-md);font-size:var(--t-md)}
.nag{background:transparent;border:1px dashed var(--border);border-radius:var(--r-md);font-size:var(--t-md);color:var(--ink-2)}
.tour-ring{box-shadow:0 0 0 3px var(--ink)}
.limtag{background:transparent;color:var(--want-ink);box-shadow:inset 0 0 0 1px var(--want)}
.av{background:var(--ink);color:var(--bg)}
.b-booked{background:color-mix(in srgb,var(--want) 22%,transparent)}.b-done{background:color-mix(in srgb,var(--been) 22%,transparent)}
.rtag{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--border);font-weight:500}

/* ---- atlas map ---- */
.mapwrap,.cmini,.fsmap,.map.small{background:var(--sea)}
.sphere{fill:var(--sea)}
.grat{fill:none;stroke:var(--grat);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.c{fill:var(--land);stroke:var(--border);stroke-width:.45;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.c.s-lived,.dotg.s-lived .dm{stroke:color-mix(in srgb,var(--ink) 55%,transparent)}
#mapBox .c.s-want,#mapBox .rg.s-want,#mapBox .dotg.s-want .dm{fill:url(#bWant)}
#mapBox .c.s-drive,#mapBox .rg.s-drive,#mapBox .dotg.s-drive .dm{fill:url(#bDrive)}
.small .c.s-want,.mini .rg.s-want,.fsmap .c.s-want,.fsmap .rg.s-want{fill:url(#pWant)}
.small .c.s-drive,.mini .rg.s-drive,.fsmap .c.s-drive,.fsmap .rg.s-drive{fill:url(#pDrive)}
.c.t-been{fill:var(--been-t)}.c.t-want{fill:var(--want-t)}.c.t-drive{fill:var(--drive-t)}.c.t-lived{fill:color-mix(in srgb,var(--lived) 34%,var(--land))}
.pw-bg{fill:var(--want-t)}.pw-ln{stroke:var(--want)}.pd-bg{fill:var(--drive-t)}.pd-dot{fill:var(--drive)}
.pm-bg{fill:color-mix(in srgb,var(--ink) 14%,var(--land))}.pm-ln{stroke:var(--ink-2)}
.pt-bg{fill:color-mix(in srgb,var(--them) 20%,var(--land))}.pt-ln{stroke:var(--them)}
.map .rg{stroke:color-mix(in srgb,var(--ink) 18%,transparent);stroke-width:.4}
.map .rg.s-been,.map .rg.s-want,.map .rg.s-drive{stroke:color-mix(in srgb,var(--land) 60%,transparent)}
.map .rg.s-lived,.mini .rg.s-lived{stroke:color-mix(in srgb,var(--ink) 55%,transparent)}
.inner{fill:none;stroke:var(--land);stroke-width:2.6;vector-effect:non-scaling-stroke;opacity:.95;pointer-events:none}
.inner.r{stroke-width:2}
.mini .rg{fill:var(--land);stroke:color-mix(in srgb,var(--ink) 22%,transparent)}
.mini .rg.sel{stroke:var(--ink);stroke-width:2.5}
.city{stroke:var(--bg);stroke-width:1.2}
.city.s-lived{fill:var(--land);stroke:var(--lived);stroke-width:3}
.cb{stroke:color-mix(in srgb,var(--ink) 45%,var(--bg))}
.farc{stroke:var(--ink);stroke-opacity:.4}
.plane{fill:var(--ink);stroke:var(--bg)}

/* ---- place sheet ---- */
.shead{border-bottom:1px solid var(--line)}
.flag.big{font-size:28px}
.stoggles{margin-bottom:var(--s3)}
.livedline{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border:1px solid var(--line);border-radius:var(--r-md);background:color-mix(in srgb,var(--lived) 9%,var(--card));margin:0 0 var(--s2)}
.livedline .dot{width:18px;height:18px;flex:none}
.livedline .lv{flex:1;min-width:0;display:flex;flex-direction:column}
.livedline .lv b{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:var(--t-lg);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.livedline .lv small{font-size:var(--t-sm);color:var(--ink-2)}
.livedform{display:flex;align-items:flex-end;gap:var(--s2);margin:0 0 var(--s2)}.livedform .fld{flex:1;margin:0}.livedform .btn{min-height:44px}
.rlist summary{font-weight:600;font-size:var(--t-md)}
.rlist .card{border-radius:var(--r-md)}
.visit{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}

/* ---- page heads, Stats, Compare ---- */
.pghead{margin:var(--s4) 2px var(--s2)}
.h-pg{font-family:var(--font-display);font-weight:450;font-size:var(--t-2xl);line-height:1.08;letter-spacing:-.015em;margin:0}
.pghead .meta{margin:6px 0 0;color:var(--ink-2);font-size:var(--t-md)}
#statsBox section,#cmpBox section{margin-top:var(--s5)}
#statsBox .sub,#cmpBox .sub{margin:0 2px var(--s3)}
.headline{margin-top:var(--s4)!important}
.headline .big{margin:0;font-family:var(--font-display);font-size:var(--t-3xl);font-weight:450;line-height:1;letter-spacing:-.02em}
.headline .big .mono{font-family:var(--font-display);font-variant-numeric:lining-nums}
.headline .big small{font-size:var(--t-lg);color:var(--ink-3);margin-left:6px;letter-spacing:0}
.headline .meta{margin:var(--s2) 0 0;color:var(--ink-2);font-size:var(--t-md)}
.track{height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin:var(--s3) 0}
.track i{display:block;height:100%;background:var(--been)}
.figs{display:grid;grid-template-columns:1fr 1fr;margin:0;border-top:1px solid var(--line)}
.figs div{display:flex;flex-direction:column-reverse;padding:10px 2px;border-bottom:1px solid var(--line)}
.figs div:nth-child(odd){padding-right:var(--s3)}.figs div:nth-child(even){padding-left:var(--s3);border-left:1px solid var(--line)}
.figs dt{font-size:var(--t-sm);color:var(--ink-2)}
.figs dd{margin:0;font-size:var(--t-lg);font-weight:500}
.figs dd small{font-size:var(--t-sm);color:var(--ink-3)}
.farline{display:flex;flex-direction:column;gap:2px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.farline b{font-family:var(--font-display);font-weight:500;font-size:var(--t-lg)}
.bars{display:flex;flex-direction:column;gap:var(--s3)}
.bars .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:var(--t-md);align-items:center;height:auto;background:none;border-radius:0;overflow:visible}
.bars .bar .nm2{min-width:0}
.bars .bar .tr{grid-column:1/3;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;display:block}
.bars .bar .tr i{display:block;height:100%;background:var(--been);border-radius:0}
.bars .bar .v{font-size:var(--t-sm);color:var(--ink-2)}
.ms{display:grid;grid-template-columns:32px 1fr auto;gap:0 var(--s3);align-items:center;min-height:56px;padding:6px 2px;border-bottom:1px solid var(--line)}
.ms .ring{grid-column:1;grid-row:1/3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--been) calc(var(--p)*1%),color-mix(in srgb,var(--ink) 10%,transparent) 0)}
.ms .ring::after{content:"";grid-area:1/1;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.ms .ring.done{background:var(--been)}.ms .ring.done::after{display:none}
.ms .ring .ic{grid-area:1/1;width:15px;height:15px;color:var(--been-ink);z-index:1;stroke-width:2.2}
.ms b{grid-column:2;align-self:end;font-weight:600;font-size:var(--t-md)}
.ms>span:not(.ring){grid-column:2;align-self:start;font-size:var(--t-sm);color:var(--ink-2)}
.ms em{grid-column:3;grid-row:1/3;font-style:normal;font-size:var(--t-sm);color:var(--ink-2)}
#statLists .card{border:0;border-top:1px solid var(--line);border-radius:0;background:none}
#statLists .lrow{padding:12px 2px}
.lrow .bar{height:6px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fcard p{margin:6px 0}
.rows{border-top:1px solid var(--line)}
.rows .frow{padding:12px 2px}
.cmpsec .fld{margin-top:0}
.cmpsec .btns{margin:var(--s2) 0}
.cmpleg{margin-top:var(--s3)}
.small .c.s-both,.fsmap .c.s-both,.cdot.s-both{fill:var(--both)}
.small .c.s-mine,.fsmap .c.s-mine{fill:url(#pMe)}.cdot.s-mine{fill:var(--ink-2)}
.small .c.s-them,.fsmap .c.s-them{fill:url(#pThem)}.cdot.s-them{fill:var(--them)}
.danger-zone{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="apple-touch-icon.png" alt="">Roamd</div>
  <button class="iconbtn" id="themeBtn" aria-label="Switch theme"></button>
  <button class="iconbtn" id="helpBtn" aria-label="Help"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4M12 17h.01"/></svg></button>
  <button class="iconbtn" id="setBtn" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
</header>
<main>
  <section id="v-map" class="view">
    <div id="nag"></div>
    <div class="mapwrap"><div id="mapBox"><div class="loading">Loading map…</div></div>
      <div class="mapctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Whole world">⟲</button><button id="zfull" aria-label="Full screen"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="zstate" aria-label="Hide states on the map" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5l5-2 6 2 5-2v16l-5 2-6-2-5 2z"/><path d="M9 3v16M15 5v16M4 12h5M15 11h5"/></svg></button><button id="zplane" aria-label="Airports"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c.8 0 1.3.9 1.3 2v4.6l6.7 4v1.8l-6.7-2.2v3.9l2 1.5V20L12 19l-3.3 1v-1.4l2-1.5v-3.9L4 16.4v-1.8l6.7-4V5c0-1.1.5-2 1.3-2z"/></svg></button></div></div>
    <div class="regionbar"><select id="regionSel" aria-label="Zoom to region"></select></div>
    <div class="legend" id="legend"></div>
  </section>
  <section id="v-list" class="view" hidden>
    <div class="listtools"><div class="qrow"><input id="q" type="search" placeholder="Search countries" autocomplete="off"><button class="btn sm ghost" id="photoImp"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>From photos</button></div>
      <div class="chips" id="fchips"><button data-f="all">All</button><button data-f="been">Been</button><button data-f="want">Want to go</button><button data-f="lived">Lived</button><button data-f="drive">Drove through</button><button data-f="none">Not yet</button></div></div>
    <div id="clist"></div>
  </section>
  <section id="v-plans" class="view" hidden>
    <div class="listtools phead"><div class="chips" id="pchips"><button data-f="all">All</button><button data-f="idea">Ideas</button><button data-f="booked">Booked</button><button data-f="done">Done</button></div>
      <button class="btn sm" id="newPlanBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New plan</button></div>
    <div id="plist"></div>
  </section>
  <section id="v-compare" class="view" hidden><div id="cmpBox" style="padding-top:6px"></div></section>
  <section id="v-stats" class="view" hidden><div id="statsBox"></div></section>
</main>
<nav class="tabs">
  <button data-tab="map"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <button data-tab="list"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Countries</button>
  <button data-tab="plans"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Plans</button>
  <button data-tab="compare"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.8.7 3 2.5 3 5.2"/></svg>Compare</button>
  <button data-tab="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-7M3 20h18"/></svg>Stats</button>
</nav>
<div id="sheets"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
