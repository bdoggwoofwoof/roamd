<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roamd</title>
<meta name="description" content="Track where you've been, plan where you're going, compare maps with friends.">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roamd">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--ink:#1f1c18;--muted:#6f685e;--line:#e5ded2;--land:#d9d2c5;--sea:#e9eef0;--been:#2f9e7a;--want:#e2a03a;--lived:#5b57d1;--accent:#c4532d;--accent-ink:#fff;--soft:#efe9df;--danger:#b4372b;
--drive:#2f7cc4;--been-ink:#fff;--want-ink:#241a05;--lived-ink:#fff;--drive-ink:#fff;--both:#2f9e7a;--mine:#c4532d;--them:#3b7fd1;--shadow:0 1px 2px rgba(40,30,20,.06),0 4px 14px rgba(40,30,20,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1d1b18;--ink:#f1ece4;--muted:#a69e92;--line:#322e29;--land:#3b3631;--sea:#191c1e;--been:#3fbf93;--want:#f0b24f;--lived:#8682f2;--drive:#5aa0e0;--drive-ink:#14171b;--accent:#e2724b;--soft:#26231f;--danger:#e2604f;--both:#3fbf93;--mine:#e2724b;--them:#5aa0f0;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--card:#1d1b18;--ink:#f1ece4;--muted:#a69e92;--line:#322e29;--land:#3b3631;--sea:#191c1e;--been:#3fbf93;--want:#f0b24f;--lived:#8682f2;--drive:#5aa0e0;--drive-ink:#14171b;--accent:#e2724b;--soft:#26231f;--danger:#e2604f;--both:#3fbf93;--mine:#e2724b;--them:#5aa0f0;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--bg)}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:1}
.brand img{width:28px;height:28px;border-radius:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}.iconbtn.sm{width:32px;height:32px}.iconbtn.sm .ic{width:17px;height:17px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.view[hidden]{display:none!important}
#v-map{display:flex;flex-direction:column;padding-bottom:10px;overflow:hidden}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:10px}
.tabs button.on{color:var(--accent)}.tabs .ic{width:23px;height:23px}
.mapwrap{flex:1;min-height:220px;position:relative;border-radius:18px;background:var(--sea);overflow:hidden;border:1px solid var(--line)}
#mapBox{position:absolute;inset:0}
.map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.map.small{height:auto;touch-action:auto;border-radius:14px;background:var(--sea)}
.sphere{fill:var(--sea)}
.c{fill:var(--land);stroke:var(--bg);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.c.none{cursor:default}.c.s-been{fill:var(--been)}.c.s-want{fill:var(--want)}.c.s-lived{fill:var(--lived)}
.dotg{cursor:pointer}.dotg .hit{fill:transparent}.dotg .dm{fill:var(--land);stroke:var(--card);stroke-width:1.2;vector-effect:non-scaling-stroke}
.dotg.s-been .dm{fill:var(--been)}.dotg.s-want .dm{fill:var(--want)}.dotg.s-lived .dm{fill:var(--lived)}
.cdot{stroke:var(--card);stroke-width:1.5}.cdot.s-both{fill:var(--both)}.cdot.s-mine{fill:var(--mine)}.cdot.s-them{fill:var(--them)}
.c.s-both{fill:var(--both)}.c.s-mine{fill:var(--mine)}.c.s-them{fill:var(--them)}
@media (hover:hover){.c:not(.none):hover{filter:brightness(.88)}}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);font-size:20px;font-weight:600}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.regionbar{margin:10px 0 0}
select,input:not([type=checkbox]):not([type=file]),textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=date]{min-height:44px}
textarea{resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 0;font-size:14px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}.lg b{color:var(--ink)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.been{background:var(--been)}.dot.want{background:var(--want)}.dot.lived{background:var(--lived)}.dot.both{background:var(--both)}.dot.mine{background:var(--mine)}.dot.them{background:var(--them)}
.nag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}.nag span{flex:1 1 180px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}.btn.sm .ic{width:17px;height:17px}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.4}.btn:active{transform:scale(.98)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.listtools{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{padding:6px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chips button.on{background:var(--ink);color:var(--bg)}
.rhead{display:flex;align-items:baseline;justify-content:space-between;font-family:Fraunces,Georgia,serif;font-size:19px;margin:18px 2px 8px}
.rhead small{font:600 13px -apple-system,sans-serif;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.card.pad{padding:14px 16px;margin-bottom:12px}
.crow{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.cmain{flex:1;display:flex;align-items:center;gap:10px;min-width:0;text-align:left;min-height:40px}
.cname{overflow:hidden;text-overflow:ellipsis}.cname small,.pick small{display:block;font-size:12px;color:var(--muted)}
.flag{font-size:22px;line-height:1}.flag.big{font-size:30px}
.qb{display:flex;gap:4px;flex:none}
.q{font-size:12px;font-weight:700;padding:7px 8px;border-radius:9px;background:var(--soft);color:var(--muted);min-width:44px}
.q.on.q-been{background:var(--been);color:#fff}.q.on.q-want{background:var(--want);color:#241a05}.q.on.q-lived{background:var(--lived);color:#fff}
.empty{color:var(--muted);text-align:center;padding:24px 8px}.empty.big .ic{width:40px;height:40px;color:var(--accent)}
.phead{display:flex;align-items:center;gap:10px;padding-top:4px}.phead .chips{flex:1;margin:0}
details.reg{margin-top:14px}
details.reg summary{list-style:none;display:flex;align-items:center;gap:10px;padding:6px 2px;cursor:pointer}
details.reg summary::-webkit-details-marker{display:none}
.rtag{font:700 11px/1 -apple-system,sans-serif;letter-spacing:.06em;background:var(--ink);color:var(--bg);padding:5px 7px;border-radius:7px;min-width:36px;text-align:center}
.rname{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;flex:1}
summary small{color:var(--muted);font-size:13px;font-weight:600}
summary .chev{transition:transform .2s;color:var(--muted)}details[open]>summary .chev{transform:rotate(90deg)}
.pcountry{margin:8px 0}
.pch{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}.pch b{flex:1}.pch small{color:var(--muted);font-weight:700}.pch .chev{color:var(--muted)}
.psec{border-top:1px solid var(--line);padding:4px 0 6px}
.psech{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);padding:8px 14px 2px;text-transform:uppercase;letter-spacing:.04em}.psech .ic{width:15px;height:15px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 14px}.prow:hover{background:var(--soft)}
.ptxt{flex:1;min-width:0;display:flex;flex-direction:column}.pt{font-weight:600}.pm{font-size:13px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;flex:none}
.b-idea{background:var(--soft);color:var(--muted)}.b-booked{background:color-mix(in srgb,var(--want) 25%,transparent);color:var(--ink)}.b-done{background:color-mix(in srgb,var(--been) 25%,transparent);color:var(--ink)}
.wish{margin:8px 2px;font-size:13px;color:var(--muted)}.wish>span{display:block;font-weight:700;margin-bottom:6px}
.wish div,.chips2{display:flex;flex-wrap:wrap;gap:6px}
.wchip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:14px;color:var(--ink)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;box-shadow:var(--shadow)}
.hero .big{font-family:Fraunces,Georgia,serif;font-size:56px;font-weight:700;line-height:1;color:var(--been)}.hero .big small{font-size:22px;color:var(--muted)}
.hero b{font-size:18px;display:block}.hero span{color:var(--muted);font-size:14px}.hero .bar{grid-column:1/-1;margin-top:10px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--been);border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.tile b{font-size:22px;display:block}.tile span{font-size:12px;color:var(--muted)}
.rbar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}.rbar .bar{grid-column:1/-1;height:6px}.rn{font-weight:600;font-size:14px}.rv{font-size:13px;color:var(--muted)}
.h3{margin:0 0 4px;font-family:Fraunces,Georgia,serif;font-size:19px}
.frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}.frow:last-child{border:0}.frow .chev{color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--them);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 4px;text-align:center}.vs b{font-family:Fraunces,Georgia,serif;font-size:36px;display:block;line-height:1}.vs span{font-size:13px;color:var(--muted)}.vsmid{color:var(--muted);font-size:13px}
.vs>div:first-child b{color:var(--mine)}.vs>div:last-child b{color:var(--them)}
.cmpmap{position:relative;min-height:120px}

/* v2: tints, states, cities, planes, palettes */
.c.t-been{fill:color-mix(in srgb,var(--been) 34%,var(--land))}.c.t-want{fill:color-mix(in srgb,var(--want) 38%,var(--land))}.c.t-lived{fill:color-mix(in srgb,var(--lived) 34%,var(--land))}
.dotg.t-been .dm{fill:color-mix(in srgb,var(--been) 45%,var(--land))}.dotg.t-want .dm{fill:color-mix(in srgb,var(--want) 45%,var(--land))}.dotg.t-lived .dm{fill:color-mix(in srgb,var(--lived) 45%,var(--land))}
.rg{fill:transparent;stroke:color-mix(in srgb,var(--card) 70%,transparent);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.rg.s-been{fill:var(--been)}.rg.s-want{fill:var(--want)}.rg.s-lived{fill:var(--lived)}
.city{stroke:var(--card);stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:pointer}.city.s-been{fill:var(--been)}.city.s-want{fill:var(--want)}.city.s-lived{fill:var(--lived)}
.plane{fill:var(--ink);stroke:var(--card);stroke-width:1.1;vector-effect:non-scaling-stroke;paint-order:stroke;cursor:pointer}
.ic.lgp{width:15px;height:15px;fill:var(--ink);stroke:none}
#zplane .ic{fill:currentColor;stroke:none;width:19px;height:19px}
#zstate .ic{width:20px;height:20px}#zstate.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}#zstate:not(.on) .ic{opacity:.55}#zstate[hidden]{display:none}
.cmini{position:relative;min-height:140px;background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mini{display:block;width:100%;max-height:52vh}
.mini .rg{fill:var(--land);stroke:var(--card);stroke-width:1}
.mini .rg.s-been{fill:var(--been)}.mini .rg.s-want{fill:var(--want)}.mini .rg.s-lived{fill:var(--lived)}
.mini .rg.sel{stroke:var(--ink);stroke-width:2.5}
.rsel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;min-height:48px;padding:8px 2px}
.rlist{margin:2px 0 6px}.rlist summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);padding:6px 2px}
.rlist .card{margin-top:6px}
.pickq0{margin:8px 0}
.q.on.q-been{background:var(--been);color:var(--been-ink)}.q.on.q-want{background:var(--want);color:var(--want-ink)}.q.on.q-lived{background:var(--lived);color:var(--lived-ink)}
.aprow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}.aprow:last-child{border:0}
.aprow .code{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;min-width:42px}
.aprow .ptxt .pm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{display:flex;align-items:center;gap:2px}.cnt b{min-width:30px;text-align:center}
.togrow{display:flex;align-items:center;gap:10px;margin:16px 2px;font-weight:600}.togrow input{width:22px;height:22px;accent-color:var(--accent)}
.pal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;border:2px solid var(--line)}
.pal.on{border-color:var(--ink)}.pal .sw{display:flex;gap:4px}.pal .sw i{width:18px;height:18px;border-radius:50%;display:block}
.pal .pn{font-weight:700;font-size:14.5px}.pal .pd{font-size:12px;color:var(--muted);line-height:1.3}
.slot-pick{display:grid;gap:6px;margin:10px 0 12px}
.slot-btn{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;border:2px solid var(--line);min-height:48px}
.slot-btn.on{border-color:var(--ink)}.slot-btn i{width:26px;height:26px;border-radius:50%;flex:none;display:block}
.slot-btn>span{display:flex;flex-direction:column;line-height:1.25}.slot-btn .d{font-size:12px;color:var(--muted)}
.wheel{position:relative;margin:4px auto 0;touch-action:none;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.wheel canvas,.wheel svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.wl{stroke:#fff;stroke-width:2;opacity:.9}.wl.sug{stroke-dasharray:4 4;opacity:.75}.wc{fill:#fff}
.wd-main{stroke:#fff;stroke-width:3}.wd-sug{stroke:#fff;stroke-width:2}
.wrapchips{flex-wrap:wrap}
.sugrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.sug-sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.btn.wide{width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.cw-prev{display:flex;gap:6px;margin:6px 0}.cw-prev span{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-weight:700;font-size:14px}

/* v4 */
:root{--home:#c4532d}
.c.home,.dotg.home .dm{fill:var(--home)}
.farc{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none}
.lmk{fill:none;stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;opacity:.7}.lmk.done{fill:var(--been);stroke:var(--card);opacity:1}
#zfull .ic{width:19px;height:19px}
.mapwrap.fs{position:fixed;inset:0;z-index:15;border-radius:0;border:0;min-height:0}
.mapwrap.fs .mapctl{top:calc(env(safe-area-inset-top) + 10px)}
body.mapfs .tabs{visibility:hidden}
.cminiwrap{position:relative}.mfs{position:absolute;top:8px;right:8px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.sheet.fsheet .fsbody{flex:1;display:flex;flex-direction:column;min-height:0}
.fsmap{flex:1;min-height:0;background:var(--sea);position:relative}
.fsmap svg{width:100%;height:100%;display:block;touch-action:none;max-height:none}
.fsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg);border-top:1px solid var(--line);min-height:62px}
.fsleg{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);margin:0}
.qrow{display:flex;gap:8px;align-items:center}.qrow input{flex:1;min-width:0}.qrow .btn{flex:none}
.visit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px 10px;margin:8px 0}
.vrow{display:flex;gap:6px;align-items:center}.vrow input{flex:1}
.tlctl{display:flex;align-items:center;gap:10px;margin:10px 0 4px}.tlctl input{flex:1}.tlctl b{min-width:120px;text-align:right;font-size:14px}
.tlrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}.tlrow:last-child{border:0}
.newtag{font-size:11px;font-weight:700;background:color-mix(in srgb,var(--been) 22%,transparent);padding:2px 7px;border-radius:99px;margin-left:4px}
.appick{display:flex;flex-direction:column;gap:2px;margin:-4px 0 6px}
.appk{text-align:left;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px}.appk small{color:var(--muted);display:block}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}.lrow:last-child{border:0}.lrow .bar{margin-top:6px;height:6px}.lrow .chev{color:var(--muted)}
details.lgrp{margin:8px 0}details.lgrp summary{display:flex;align-items:center;gap:8px;padding:8px 2px;cursor:pointer;list-style:none}details.lgrp summary::-webkit-details-marker{display:none}details.lgrp summary b{flex:1}details.lgrp summary small{color:var(--muted);font-weight:700}
.litem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.litem:last-child{border:0}.litem input{width:22px;height:22px;accent-color:var(--been);flex:none}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;opacity:.72}
.badge.on{opacity:1;border-color:color-mix(in srgb,var(--been) 55%,var(--line));background:color-mix(in srgb,var(--been) 10%,var(--card))}
.badge .bico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);margin-bottom:4px}.badge.on .bico{background:var(--been);color:var(--been-ink)}.badge .bico .ic{width:17px;height:17px;fill:currentColor;stroke:none}
.badge b{font-size:14.5px}.badge>span:not(.bico):not(.bprog){font-size:12px;color:var(--muted);line-height:1.3}.badge small{font-size:11px;color:var(--muted)}
.bprog{height:5px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}.bprog i{display:block;height:100%;background:var(--been)}
.farcard{display:flex;flex-direction:column;gap:2px;margin-top:10px;text-align:left;width:100%}.farcard b{font-size:18px}
.fcard p{margin:4px 0}
.tile b small{font-size:13px;color:var(--muted)}
.homecols{display:flex;gap:8px;align-items:center;margin:-2px 2px 10px;flex-wrap:wrap}.hc{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}.hc.on{box-shadow:0 0 0 2px var(--ink)}
.shimg{margin:12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;min-height:200px;background:var(--soft)}.shimg img{display:block;width:100%}
.phres{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;opacity:.55}
.phres.on{opacity:1;border-color:var(--been)}.phres .tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:transparent;font-weight:800;flex:none}.phres.on .tick{background:var(--been);color:var(--been-ink)}
.packrow{margin-top:8px}
textarea#packIn{font-size:15px}

/* drove through */
.c.s-drive{fill:var(--drive)}.c.t-drive{fill:color-mix(in srgb,var(--drive) 34%,var(--land))}
.dotg.s-drive .dm{fill:var(--drive)}.dotg.t-drive .dm{fill:color-mix(in srgb,var(--drive) 45%,var(--land))}
.rg.s-drive,.mini .rg.s-drive{fill:var(--drive)}
.bords{pointer-events:none}.wrapc{pointer-events:none}.map{--cbmax:1.4px}.cb{fill:none;stroke:color-mix(in srgb,var(--ink) 55%,var(--bg));stroke-width:var(--cbmax);stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .rg{stroke:color-mix(in srgb,var(--bg) 55%,transparent);stroke-width:.45}
:root[data-theme="dark"] .map{--cbmax:2.4px}:root[data-theme="dark"] .cb{stroke:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .map{--cbmax:2.4px}:root:not([data-theme="light"]) .cb{stroke:#000}}.city.s-drive{fill:var(--drive)}
.dot.drive{background:var(--drive)}
.q.on.q-drive{background:var(--drive);color:var(--drive-ink)}
.st.on.st-drive{border-color:var(--drive);background:color-mix(in srgb,var(--drive) 15%,var(--card))}
.stoggles{grid-template-columns:repeat(2,1fr)!important}
.q{min-width:40px;padding:7px 6px}
@media (max-width:400px){.crow .q{min-width:34px;padding:7px 4px;font-size:11px}.crow{gap:4px;padding-left:10px}}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.in{transform:none}
.shead{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.stitle{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.tt{display:flex;flex-direction:column;min-width:0}.tt b{font-family:Fraunces,Georgia,serif;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{font-size:12px;color:var(--muted)}
.sright{display:flex}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(env(safe-area-inset-bottom) + 30px)}
.pickq{padding:10px 16px 0}
.stoggles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.st.on.st-been{border-color:var(--been);background:color-mix(in srgb,var(--been) 15%,var(--card))}
.st.on.st-want{border-color:var(--want);background:color-mix(in srgb,var(--want) 18%,var(--card))}
.st.on.st-lived{border-color:var(--lived);background:color-mix(in srgb,var(--lived) 15%,var(--card))}
.st:not(.on) .dot{opacity:.35}
.fld{display:block;margin:10px 0}.fld>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 5px 2px}
.sub{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}.sub small{text-transform:none;letter-spacing:0;font-weight:600}
.sub.danger{color:var(--danger)}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:22px}.subrow .sub{margin:0}.btns{display:flex;gap:6px}
.secbox{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.sech{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-bottom:1px solid var(--line)}.sech b{flex:1}.sech.muted{font-size:13px;font-weight:700;color:var(--muted);padding:10px 14px}
.addline{display:flex;align-items:center;gap:6px;width:100%;padding:10px 14px;color:var(--accent);font-weight:600;font-size:14px;border-top:1px solid var(--line)}
.ptitle{font-family:Fraunces,Georgia,serif;font-size:24px!important;font-weight:600;border:0!important;background:transparent!important;padding:4px 2px!important;box-shadow:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .fld{margin:6px 0}
.selbtn{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.vids{display:flex;flex-direction:column;gap:10px}
.vid{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.vtop{display:flex;align-items:center;gap:8px}.vnote{flex:1;padding:6px 10px!important;font-size:14px}
.vhost{font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;background:var(--soft);white-space:nowrap}
.h-tt{background:#111;color:#fff}.h-ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);color:#fff}.h-yt{background:#e62117;color:#fff}
.vframe{margin-top:8px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.vframe{min-height:64px}.vframe.on.wide{aspect-ratio:16/9}.vframe.on.tall{aspect-ratio:9/16;max-height:72vh;max-width:420px;margin-left:auto;margin-right:auto;width:100%}
.vframe iframe{width:100%;height:100%;border:0}
.vlink{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}.vlink .ic{width:16px;height:16px}
.addlink{display:flex;gap:6px;margin-top:10px}.addlink input{flex:1;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ph{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);position:relative;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{border:1.5px dashed var(--line);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ph.missing::after{content:"missing";position:absolute;font-size:11px;color:var(--muted)}
.viewer img{width:100%;max-height:68vh;object-fit:contain;border-radius:12px;background:#000}
.vnav{display:flex;justify-content:space-between;margin:10px 0}
.todos{display:flex;flex-direction:column;gap:6px}
.todo{display:flex;align-items:center;gap:8px}.todo input[type=checkbox]{width:22px;height:22px;accent-color:var(--been);flex:none}
.tdt{padding:8px 10px!important}.tdt.done{text-decoration:line-through;color:var(--muted)}
.todo.add input{flex:1}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}.pick:last-child{border:0}.pick small{margin-left:auto}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12px}.pad{padding:12px}.wrap{word-break:break-all}
.help p,.help li{font-size:15px}.lims{padding-left:18px}.lims li{margin:6px 0}.ver{margin-top:24px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* tour (Ironwood-style spotlight) */
.tour{position:fixed;inset:0;z-index:90}
.tour-hole{position:fixed;inset:0;pointer-events:none}
.tour-dim{position:absolute;inset:0;width:100%;height:100%;display:block}
.tour-ring{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;box-shadow:0 0 0 3px var(--accent);opacity:0;will-change:transform}
.tour-card{position:fixed;left:12px;right:12px;top:0;max-width:520px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 36px rgba(0,0,0,.4);opacity:0;will-change:transform,opacity}
.tour-txt{animation:tourfade .25s ease}.tour-txt h3{margin:4px 0 6px;font-family:Fraunces,Georgia,serif;font-size:21px}.tour-txt p{margin:0 0 14px;font-size:15px;color:var(--ink)}
.trow{display:flex;align-items:center;gap:8px}.eyebrow{flex:1;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.tskip{font-size:14px;font-weight:600;color:var(--accent);min-height:28px}
.tbtns{display:flex;gap:8px}.tbtns .btn{flex:2}.tbtns .btn.ghost{flex:1}
.limtag{background:var(--want);color:var(--want-ink);padding:2px 8px;border-radius:99px;font-size:11px}
body.tour-on main,body.tour-on #sheets{transition:opacity .2s}body.tour-fading main,body.tour-fading #sheets{opacity:0}
@keyframes tourfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.tour-txt{animation:none}body.tour-on main,body.tour-on #sheets{transition:none}}
/* switches + state toggles */
.sw-tog{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw-tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw-tog.on{background:var(--been)}.sw-tog.on i{transform:translateX(20px)}
.strow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.strow:last-child{border-bottom:0}
.strow.top{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.stname{flex:1;min-width:0;display:flex;flex-direction:column}.stname small{font-size:12px;color:var(--muted)}.stname .flag{font-size:18px}
.stlist.dim{opacity:.55}
.stctl{display:flex;align-items:center;gap:8px;margin:-2px 2px 8px}.stctl .small{flex:1}
.sheet .strow{background:transparent}.sbody>.strow{border:1px solid var(--line);border-radius:14px;margin:12px 0 8px;background:var(--card)}
.c.dsp{stroke:var(--ink);stroke-width:.6;stroke-dasharray:2 2}
.dnote{margin:12px 2px}
@media (min-width:760px){.view{padding-left:max(16px,calc(50% - 360px));padding-right:max(16px,calc(50% - 360px))}.sbody{padding-left:max(16px,calc(50% - 340px));padding-right:max(16px,calc(50% - 340px))}}
@media (max-width:370px){.q{min-width:38px;padding:7px 5px;font-size:11px}.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="apple-touch-icon.png" alt="">Roamd</div>
  <button class="iconbtn" id="themeBtn" aria-label="Switch theme"></button>
  <button class="iconbtn" id="helpBtn" aria-label="Help"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4M12 17h.01"/></svg></button>
  <button class="iconbtn" id="setBtn" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
</header>
<main>
  <section id="v-map" class="view">
    <div id="nag"></div>
    <div class="mapwrap"><div id="mapBox"><div class="loading">Loading map…</div></div>
      <div class="mapctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Whole world">⟲</button><button id="zfull" aria-label="Full screen"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="zstate" aria-label="Hide states on the map" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5l5-2 6 2 5-2v16l-5 2-6-2-5 2z"/><path d="M9 3v16M15 5v16M4 12h5M15 11h5"/></svg></button><button id="zplane" aria-label="Airports"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c.8 0 1.3.9 1.3 2v4.6l6.7 4v1.8l-6.7-2.2v3.9l2 1.5V20L12 19l-3.3 1v-1.4l2-1.5v-3.9L4 16.4v-1.8l6.7-4V5c0-1.1.5-2 1.3-2z"/></svg></button></div></div>
    <div class="regionbar"><select id="regionSel" aria-label="Zoom to region"></select></div>
    <div class="legend" id="legend"></div>
  </section>
  <section id="v-list" class="view" hidden>
    <div class="listtools"><div class="qrow"><input id="q" type="search" placeholder="Search countries" autocomplete="off"><button class="btn sm ghost" id="photoImp"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>From photos</button></div>
      <div class="chips" id="fchips"><button data-f="all">All</button><button data-f="been">Been</button><button data-f="want">Want to go</button><button data-f="lived">Lived</button><button data-f="drive">Drove through</button><button data-f="none">Not yet</button></div></div>
    <div id="clist"></div>
  </section>
  <section id="v-plans" class="view" hidden>
    <div class="listtools phead"><div class="chips" id="pchips"><button data-f="all">All</button><button data-f="idea">Ideas</button><button data-f="booked">Booked</button><button data-f="done">Done</button></div>
      <button class="btn sm" id="newPlanBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New plan</button></div>
    <div id="plist"></div>
  </section>
  <section id="v-compare" class="view" hidden><div id="cmpBox" style="padding-top:6px"></div></section>
  <section id="v-stats" class="view" hidden><div id="statsBox"></div></section>
</main>
<nav class="tabs">
  <button data-tab="map"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <button data-tab="list"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Countries</button>
  <button data-tab="plans"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Plans</button>
  <button data-tab="compare"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.8.7 3 2.5 3 5.2"/></svg>Compare</button>
  <button data-tab="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-7M3 20h18"/></svg>Stats</button>

<div id="sheets"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
